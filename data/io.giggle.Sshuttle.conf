<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- 允许 root 拥有该总线名称 -->
  <policy user="root">
    <allow own="io.giggle.Sshuttle"/>
    <allow send_destination="io.giggle.Sshuttle"/>
    <allow receive_sender="io.giggle.Sshuttle"/>
  </policy>

  <!-- 允许普通用户向该服务发送消息和接收信号 -->
  <policy context="default">
    <allow send_destination="io.giggle.Sshuttle"/>
    <allow receive_sender="io.giggle.Sshuttle"/>
  </policy>
</busconfig>
