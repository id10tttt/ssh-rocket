[workspace]
resolver = "2"
members = [
    "crates/ssh-rocket-core",
    "crates/ssh-rocket-runtime",
    "crates/ssh-rocket-gui",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1.0"
dirs = "6.0"
env_logger = "0.11"
ipnet = { version = "2.11", features = ["serde"] }
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1.18", features = ["v4", "serde"] }
