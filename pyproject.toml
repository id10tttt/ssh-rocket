[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sshuttle-gui"
version = "1.0.0"
description = "Native GTK4 and Libadwaita frontend for sshuttle"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
sshuttle-gui = "src.main:main"
sshuttle-gui-helper = "helper.daemon:main"
